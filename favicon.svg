<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#faf8f1"/>
  <!-- gold ring, echoing the F–ring–M logo -->
  <circle cx="50" cy="52" r="20" fill="none" stroke="#c9a23c" stroke-width="4.5"/>
  <circle cx="50" cy="52" r="14.5" fill="none" stroke="#c9a23c" stroke-width="1.6" opacity="0.55"/>
  <!-- initials, sitting either side of the ring -->
  <text x="26" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" font-size="46" fill="#33517a">F</text>
  <text x="76" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" font-size="46" fill="#33517a">M</text>
</svg>
